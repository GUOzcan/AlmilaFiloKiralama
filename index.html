<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Almila Filo Kiralama</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json?v=2" />
    <meta name="theme-color" content="#080808" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black → status bar tamamen siyah, kırmızı sızmaz -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Almila Filo" />
    <!-- ?v=2 cache-bust → Safari yeni ikonu zorla yükler -->
    <link rel="apple-touch-icon" href="/icon-512.png?v=2" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png?v=2" />

    <meta name="description" content="Almila Filo Kiralama Araç Yönetim Sistemi" />
    <meta property="og:title" content="Almila Filo Kiralama" />
    <meta property="og:description" content="Araç filo yönetim sistemi" />
    <meta property="og:image" content="/icon-512.png" />

    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #080808;
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        touch-action: pan-x pan-y;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
